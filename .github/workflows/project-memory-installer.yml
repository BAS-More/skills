name: Project memory installer
on:
  pull_request:
    paths:
      - 'scripts/project-memory/**'
      - '.github/workflows/project-memory-installer.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/project-memory/**'
      - '.github/workflows/project-memory-installer.yml'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version
      - run: node --test scripts/project-memory/install.test.mjs
