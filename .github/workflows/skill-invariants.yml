name: Skill invariants
# Enforces the publication rules in CLAUDE-PROJECT-RULES.md, which were
# convention-only until now: a promoted skill must be reachable from both
# public indexes, an unpromoted one from neither. Those rules span three file
# sets (skills/, README.md, the plugin manifest), so any one of them can be
# edited into an inconsistent state on its own, which is how the four `misc/`
# skills went unlisted in the manifest until a later pass caught it.
#
# Every path below is an input the checker reads, so the filter never skips a
# run that could change the outcome: editing README.md alone can break an
# invariant just as surely as adding a skill.
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - '.claude-plugin/plugin.json'
      - 'package.json'
      - 'scripts/check-invariants.sh'
      - 'scripts/check-invariants.test.mjs'
      - 'scripts/sync-plugin-version.mjs'
      - '.github/workflows/skill-invariants.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'README.md'
      - '.claude-plugin/plugin.json'
      - 'package.json'
      - 'scripts/check-invariants.sh'
      - 'scripts/check-invariants.test.mjs'
      - 'scripts/sync-plugin-version.mjs'
      - '.github/workflows/skill-invariants.yml'
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA, not a tag: a tag is a mutable pointer, so
      # repointing it would be arbitrary code execution in CI.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # No toolchain setup step: the checker is bash + coreutils + grep + sed on
      # purpose, so it runs identically here, in a pre-commit hook, and on a
      # laptop with nothing installed.
      - run: ./scripts/check-invariants.sh
      # Proves the gate rejects every spelling of an unpromoted manifest entry,
      # not just the byte-exact one. Node is a test-only need (it builds the
      # fixture trees) and ships on the runner.
      - run: node --test scripts/check-invariants.test.mjs
      # The two manifests carry the same version, and nothing checked that they
      # agreed. `--check` existed and had no callers: `npm run version` writes the
      # value, release.yml is guarded off on this fork, and neither path filter
      # named package.json, so a hand-edited version could ship out of step with
      # the published plugin and no job would notice. Both files are now in the
      # filters above, so this step runs exactly when either can change.
      - run: npm run check-plugin-version
